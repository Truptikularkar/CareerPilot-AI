name: CareerPilot AI CI & Quality Regression Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test_and_evaluate:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run PyTest Test Suite (100% Offline)
      env:
        CAREERPILOT_MODE: DEMO
        LLM_PROVIDER: mock
      run: |
        pytest -v tests/

    - name: Run Deterministic AI Evaluation & Regression Suite
      env:
        CAREERPILOT_MODE: DEMO
        LLM_PROVIDER: mock
      run: |
        python -m careerpilot.evaluation.__main__ all
